    <script>
      // Áp theme trước khi vẽ để không bị nháy (FOUC).
      // Thứ tự: lựa chọn user đã lưu → system → giờ VN (GMT+7: 18h–6h = tối).
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark;
          if (t === "dark" || t === "light") {
            dark = t === "dark";
          } else if (matchMedia("(prefers-color-scheme: dark)").matches) {
            dark = true;
          } else if (matchMedia("(prefers-color-scheme: light)").matches) {
            dark = false;
          } else {
            var h = (new Date().getUTCHours() + 7) % 24;
            dark = h >= 18 || h < 6;
          }
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>

        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #94a3b8;
        font-family: Inter, system-ui, sans-serif;
      }
      #boot p { margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; }
      #boot-mark, #boot-logo { width: 44px; height: 44px; border-radius: 8px; object-fit: contain; animation: boot-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      #boot .boot-ink { fill: #001638; }
      html.dark #boot .boot-ink { fill: #ffffff; }
      @keyframes boot-pulse { 50% { opacity: 0.5 } }
      @media (prefers-reduced-motion: reduce) { #boot-mark, #boot-logo { animation: none } }

    <script>
      // Boot splash follows the saved language and custom brand logo (same storage keys as the app).
      (function () {
        try {
          var brand = JSON.parse(localStorage.getItem("brand_v1") || "null") || {};
          var lang = localStorage.getItem("ui_lang") || brand.language || "vi";
          if (lang === "en") document.getElementById("boot-text").textContent = "Loading…";
          var dark = document.documentElement.classList.contains("dark");
          var url = dark ? brand.logoDarkUrl || brand.logoUrl : brand.logoUrl;
          if (url) {
            var img = document.createElement("img");
            img.id = "boot-logo";
            img.alt = "";
            img.src = url;
            document.getElementById("boot-mark").replaceWith(img);
          }
        } catch (e) {}
      })();
    </script>
